name: test

on:
  push:
    branches:
    - master
    - develop
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          # L2Deployer's initcode (~59.6 KB) is over the EIP-3860 limit (49,152 B). It is only deployed on
          # the L2 rollups (scripts/RegisterRollup.s.sol), and forge's size report now fails the build on it,
          # so keep printing sizes but don't exit non-zero on the initcode limit.
          forge build --sizes --ignore-eip-3860
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv --fork-url ${{ secrets.ETH_RPC_URL }}
        id: test